name: Production Checkout Guard Test

on:
  workflow_run:
    workflows: ["Attacker PR Test"]
    types: [completed]

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Record workflow_run event metadata
        run: |
          echo "EVENT_NAME=${{ github.event_name }}"
          echo "WR_ID=${{ github.event.workflow_run.id }}"
          echo "WR_HEAD_SHA=${{ github.event.workflow_run.head_sha }}"
          echo "WR_HEAD_BRANCH=${{ github.event.workflow_run.head_branch }}"
          echo "WR_HEAD_REPO_ID=${{ github.event.workflow_run.head_repository.id }}"
          echo "WR_HEAD_REPO_FULL_NAME=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "WR_REPO_ID=${{ github.event.workflow_run.repository.id }}"
          echo "WR_REPO_FULL_NAME=${{ github.event.workflow_run.repository.full_name }}"
          echo "WR_HEAD_REPO_JSON=${{ toJSON(github.event.workflow_run.head_repository) }}"
          echo "WR_PULL_REQUESTS=${{ toJSON(github.event.workflow_run.pull_requests) }}"
          echo "WR_CONCLUSION=${{ github.event.workflow_run.conclusion }}"

  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Record event metadata for the guard probe
        run: |
          echo "PROBE_EVENT_NAME=${{ github.event_name }}"
          echo "PROBE_PR_NUMBER=${{ github.event.workflow_run.pull_requests[0].number }}"
          echo "PROBE_HEAD_REPO_JSON=${{ toJSON(github.event.workflow_run.head_repository) }}"

      - name: actions/checkout v7 with a pull request ref
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head
          persist-credentials: false

      - name: Inspect the workspace after checkout (no execution)
        if: always()
        run: |
          echo "CHECKOUT_OUTCOME=${{ steps.checkout.outcome }}"
          echo "WORKSPACE_HEAD=$(git -C . rev-parse HEAD 2>/dev/null || echo none)"
          echo "FORK_MARKER_PRESENT=$(test -f FORK_CODE.txt && echo YES || echo NO)"
          echo "BASE_MARKER_PRESENT=$(test -f BASE_CODE.txt && echo YES || echo NO)"
          echo "WORKSPACE_LISTING_BEGIN"
          ls -a1 2>/dev/null || true
          echo "WORKSPACE_LISTING_END"
