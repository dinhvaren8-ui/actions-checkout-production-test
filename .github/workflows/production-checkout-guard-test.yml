name: Production Checkout Guard Test

on:
  workflow_run:
    workflows: ["Attacker PR Test", "Fork Timing Window"]
    types: [completed]

permissions:
  contents: read

env:
  EXPLICIT_PR_NUMBER: '2'

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Record workflow_run event metadata
        env:
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_REPO_JSON: ${{ toJSON(github.event.workflow_run.head_repository) }}
          WR_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          echo "EVENT_NAME=${{ github.event_name }}"
          echo "WR_ID=${{ github.event.workflow_run.id }}"
          echo "WR_NAME=${{ github.event.workflow_run.name }}"
          echo "WR_EVENT=${{ github.event.workflow_run.event }}"
          echo "WR_HEAD_SHA=${{ github.event.workflow_run.head_sha }}"
          echo "WR_HEAD_BRANCH=$WR_HEAD_BRANCH"
          echo "WR_HEAD_REPO_ID=${{ github.event.workflow_run.head_repository.id }}"
          echo "WR_REPO_ID=${{ github.event.workflow_run.repository.id }}"
          echo "WR_REPO_FULL_NAME=${{ github.event.workflow_run.repository.full_name }}"
          echo "WR_CONCLUSION=${{ github.event.workflow_run.conclusion }}"
          echo "WR_HEAD_REPO_JSON_BEGIN"
          echo "$WR_HEAD_REPO_JSON"
          echo "WR_HEAD_REPO_JSON_END"
          echo "WR_PULL_REQUESTS_BEGIN"
          echo "$WR_PULL_REQUESTS"
          echo "WR_PULL_REQUESTS_END"

  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Record event metadata for the guard probe
        env:
          HEADS: ${{ toJSON(github.event.workflow_run.head_repository) }}
          PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          echo "PROBE_EVENT_NAME=${{ github.event_name }}"
          echo "PROBE_WR_ID=${{ github.event.workflow_run.id }}"
          echo "PROBE_WR_NAME=${{ github.event.workflow_run.name }}"
          echo "PROBE_PR_LIST_BEGIN"
          echo "$PRS"
          echo "PROBE_PR_LIST_END"
          echo "PROBE_HEAD_REPO_JSON_BEGIN"
          echo "$HEADS"
          echo "PROBE_HEAD_REPO_JSON_END"

      - name: Probe A - ref built from the event payload alone
        id: probeA
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head
          path: probe-natural
          persist-credentials: false

      - name: Probe B - same event, pull request number supplied explicitly
        id: probeB
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ env.EXPLICIT_PR_NUMBER }}/head
          path: probe-explicit
          persist-credentials: false

      - name: Inspect both workspaces (no execution)
        if: always()
        run: |
          echo "PROBE_A_OUTCOME=${{ steps.probeA.outcome }}"
          echo "PROBE_B_OUTCOME=${{ steps.probeB.outcome }}"
          echo "PROBE_A_HEAD=$(git -C probe-natural rev-parse HEAD 2>/dev/null || echo none)"
          echo "PROBE_B_HEAD=$(git -C probe-explicit rev-parse HEAD 2>/dev/null || echo none)"
          echo "PROBE_A_FORK_MARKER=$(test -f probe-natural/FORK_CODE.txt && echo YES || echo NO)"
          echo "PROBE_B_FORK_MARKER=$(test -f probe-explicit/FORK_CODE.txt && echo YES || echo NO)"
          echo "PROBE_B_BASE_MARKER=$(test -f probe-explicit/BASE_CODE.txt && echo YES || echo NO)"
